    name: Build Android APK Nativo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Usa a máquina mais atual e rápida do GitHub

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4 # Gerenciador oficial do GitHub que resolve caminhos automaticamente

    - name: Build APK
      run: |
        cd src/platform/android || cd src/android || cd .
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: OpenLara-APK-Final
        path: |
          **/*.apk
