name: Build Android APK Antigo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04 # Força uma versão mais antiga do Linux no servidor

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8' # Força o Java antigo que o Gradle do projeto exige

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Specific NDK
      run: |
        sdkmanager --install "ndk;21.4.7075529" # Versão do NDK compatível com projetos antigos

    - name: Build APK
      run: |
        cd src/platform/android || cd src/android || cd .
        chmod +x gradlew
        ./gradlew assembleDebug
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.sdk-path }}/ndk/21.4.7075529

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: OpenLara-APK-Corrigido
        path: |
          **/*.apk
        name: OpenLara-APK
        path: |
          **/*.apk
